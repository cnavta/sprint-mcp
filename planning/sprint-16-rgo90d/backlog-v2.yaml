      - pre-archive hook executes before moving to archive
      - pre-archive failure BLOCKS archival
      - post-archive hook executes after sprint archived
      - post-archive failure logged but doesn't block
      - Hooks work with both manual and auto-archive

    implementation:
      - cleanup-sprint.ts Before worktree removal, call executeHook('pre-worktree-remove', context)
      - If pre-worktree-remove fails, return error result (BLOCKING)
      - archive-sprint.ts Before archiving, call executeHook('pre-archive', context)
      - If pre-archive fails, return error result (BLOCKING)
      - After successful archive, call executeHook('post-archive', context)
      - If post-archive fails, log warning (NON-BLOCKING)

    validation:
      - Integration test with cleanup workflow
      - Integration test with archive workflow
      - Test with auto-archive-sprints tool
      - Verify blocking and non-blocking behavior

    notes: |
      pre-worktree-remove is BLOCKING - prevents data loss (stop services, backup data)
      pre-archive is BLOCKING - final validations before archival
      post-archive is NON-BLOCKING - external system updates, metrics

