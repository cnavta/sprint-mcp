  - id: CORE-005
    title: Integrate on-status-change Hook
    description: Add on-status-change hook execution to update-sprint-status tool (pre and post phases)
    phase: phase-1
    priority: P0
    status: completed
    assignee: Lead Implementor
    estimatedHours: 1.5
    completedAt: 2026-08-07T17:00:00Z

    dependencies:
      - CORE-003  # Needs executeHook()
    blockedBy: []

    files:
      create: []
      modify:
        - src/tools/update-sprint-status.ts

    acceptanceCriteria:
      - Hook executes in PRE phase before status update
      - PRE phase failure BLOCKS status update (returns error)
      - Hook executes in POST phase after status update
      - POST phase failure logged but doesn't block
      - Hook receives statusFrom, statusTo, lifecyclePhase correctly
      - Works for ALL status transitions (not just completion)
      - Clear error messages on pre-phase failure

    implementation:
      - Import executeHook and types
      - Get current status from manifest before update
      - BEFORE status update, call executeHook('on-status-change', { ...context, statusFrom, statusTo: newStatus, lifecyclePhase 'pre' })
      - If pre-phase fails, return error result (BLOCKING)
      - Update status in manifest
      - AFTER status update, call executeHook('on-status-change', { ...context, statusFrom, statusTo newStatus, lifecyclePhase 'post' })
      - If post-phase fails, log warning (NON-BLOCKING)

    validation:
      - Integration test with on-status-change hook
      - Test blocking on pre-phase failure
      - Test non-blocking post-phase
      - Test multiple status transitions (planning → in-progress → complete)
      - Verify status variables passed correctly

    notes: |
      This hook replaces the original pre-complete and post-complete hooks with a
      single generic hook that handles ALL status transitions. Much more flexible
      and scalable. The hook can use SPRINT_STATUS_FROM/TO to decide what to do.

