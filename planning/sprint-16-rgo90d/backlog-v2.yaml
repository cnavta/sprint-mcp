# ============================================================================
# Summary
# ============================================================================

summary:
  totalTasks: 14  # Reduced from 15 (combined pre-complete + post-complete into on-status-change)
  breakdown:
    phase1: 6 tasks  # Core system
    phase2: 4 tasks  # Templates & docs
    phase3: 4 tasks  # Testing

  priorities:
    p0: 10 tasks     # Critical path
    p1: 2 tasks      # Important but not blocking
    p2: 2 tasks      # Nice to have

  estimatedEffort:
    minimum: 8 hours
    maximum: 10 hours
    average: 9 hours

  dependencies:
    criticalPath:
      - CORE-001 (Types) →
      - CORE-002 (Discovery) →
      - CORE-003 (Execution) →
      - CORE-004, CORE-005, CORE-006 (Integrations) →
      - TEST-003 (Integration tests)

    parallelizable:
      - CORE-004, CORE-005, CORE-006 can be done in parallel after CORE-003
      - TMPL-001, TMPL-002 can be done in parallel
      - TEST-001, TEST-002, TEST-004 can be done in parallel

  hookModel:
    type: option-a-explicit-lifecycle-generic-status
    lifecycleHooks: 4
    statusHooks: 1
    totalHooks: 5
    benefits:
      - Cleaner separation of concerns
      - Single hook handles all status transitions
      - Scales to new statuses without new hooks
      - More flexible than explicit per-status hooks

  risks:
    - Hook execution security (mitigated by project-only discovery)
    - Platform compatibility (documented, Bash required)
    - Hook failures breaking workflow (clear error messages, non-blocking where appropriate)

