# Sprint 16 Backlog v2 - Sprint Lifecycle Hooks Implementation
# Version 2.0 - Revised Hook Model (Option A: Separate Lifecycle and Status Hooks)

sprint:
  id: sprint-16-rgo90d
  title: Sprint Lifecycle Hooks Implementation
  goal: Implement sprint lifecycle hooks system to automate worktree setup and enable project-specific automation
  owner: Christopher Navta
  createdAt: 2026-08-07
  priority: P0
  estimatedHours: 8-10
  version: 2.0
  versionNotes: Revised hook model - 5 explicit hooks (4 lifecycle + 1 generic status change)

metadata:
  totalTasks: 14
  completedTasks: 8
  inProgressTasks: 0
  blockedTasks: 0
  deferredTasks: 0

hookModel:
  type: option-a-explicit-lifecycle-generic-status
  description: Separate lifecycle hooks (explicit) from status change hooks (generic)
  lifecycleHooks:
    - post-worktree-create  # After worktree created
    - pre-worktree-remove   # Before worktree removed
    - pre-archive           # Before archiving
    - post-archive          # After archived
  statusHooks:
    - on-status-change      # Before/after ANY status transition
  totalHooks: 5

phases:
  - id: phase-1
    name: Core Hook System
    description: Implement hook discovery, execution, and integration with MCP tools
    tasks: [CORE-001, CORE-002, CORE-003, CORE-004, CORE-005, CORE-006]
    estimatedHours: 4-5

  - id: phase-2
    name: Templates & Documentation
    description: Create example hooks and update documentation
    tasks: [TMPL-001, TMPL-002, DOCS-001, DOCS-002]
    estimatedHours: 2-3

  - id: phase-3
    name: Testing
    description: Comprehensive test coverage for hooks system
    tasks: [TEST-001, TEST-002, TEST-003, TEST-004]
    estimatedHours: 2-3

tasks:
  # ============================================================================
  # Phase 1: Core Hook System
  # ============================================================================

