      - pre-complete failure BLOCKS completion (returns error)
      - post-complete hook executes after status updated
      - post-complete failure logged but doesn't block
      - Clear error messages on pre-complete failure
      - Hook context includes correct sprint info

    implementation:
      - Import executeHook and types
      - Before validation, call executeHook('pre-complete', context)
      - If pre-complete fails, return error result (BLOCKING)
      - After status update, call executeHook('post-complete', context)
      - If post-complete fails, log warning (NON-BLOCKING)

    validation:
      - Integration test with blocking pre-complete
