  - id: CORE-002
    title: Implement Hook Discovery
    description: Implement findHook() function to locate and validate hook scripts
    phase: phase-1
    priority: P0
    status: pending
    assignee: Lead Implementor
    estimatedHours: 1.0

    dependencies:
      - CORE-001  # Needs HookName type
    blockedBy: []

    files:
      create:
        - src/common/hook-manager.ts
      modify: []

    acceptanceCriteria:
      - findHook() returns path for existing executable hooks
      - Returns null for non-existent hooks
      - Returns null for non-executable hooks (with warning log)
      - No errors thrown for missing .sprint-hooks directory
      - Checks executable permission correctly (mode & 0o111)
      - Works for all 6 hook types

    implementation:
      - Create src/common/hook-manager.ts
      - Implement findHook(hookName) function
      - Construct path to .sprint-hooks/{hookName}
      - Check file existence using fileExists()
      - Check executable permission using stat()
      - Log warning if hook exists but not executable
      - Return path if valid, null otherwise

    validation:
      - Unit tests for all scenarios (Task TEST-001)
      - Manual test with real hook file
      - Verify warning logged for non-executable hooks

    notes: |
      Hook discovery is critical for security - only executable files in
      .sprint-hooks/ should be recognized as hooks.

  - id: CORE-003
    title: Implement Hook Execution
    description: Implement executeHook() function to run hooks with proper environment and error handling
    phase: phase-1
    priority: P0
    status: pending
    assignee: Lead Implementor
    estimatedHours: 1.5

    dependencies:
      - CORE-001  # Needs HookContext and HookResult types
      - CORE-002  # Needs findHook()
    blockedBy: []

    files:
      create: []
      modify:
        - src/common/hook-manager.ts

    acceptanceCriteria:
      - executeHook() runs hooks and captures stdout/stderr
      - Returns executed: false when no hook found
      - Passes all required environment variables
      - Returns correct exit code
      - Handles hook failures gracefully
      - Respects timeout (default 5 minutes)
      - Works from any working directory

    implementation:
      - Implement executeHook(hookName, context) function
      - Call findHook() to locate hook
      - Build environment variables from context
      - Execute hook using execSync with proper options
      - Capture stdout and stderr
      - Handle errors and timeouts
      - Return HookResult with all captured data

    validation:
      - Unit tests for success and failure (Task TEST-002)
      - Test environment variable passing
      - Test timeout handling
      - Test error capture

    notes: |
      execSync options:
      - cwd: context.worktreePath
      - env: { ...process.env, SPRINT_ID, SPRINT_WORKTREE, ... }
      - encoding: 'utf-8'
      - stdio: 'pipe'
      - timeout: 300000 (5 minutes)

