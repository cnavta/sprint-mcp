# =============================================================================
# PHASE 1: CRITICAL FOUNDATIONS (Pre-npm v1.0)
# Goal: All audiences + all use cases supported for v1.0 launch
# Timeline: 5-6 sprints (2.5-3 weeks at 2 sprints/week)
# =============================================================================

phase_1_critical:

  # ---------------------------------------------------------------------------
  # Multi-Audience Foundation
  # ---------------------------------------------------------------------------

  - id: P1-T01
    title: Use Case Spectrum Landing Page
    description: |
      Create entry point routing page that helps users choose their path based
      on audience type and use case. "What's your vibe?" selector.
    audience: [all]
    use_case: [all]
    priority: P1-Critical
    effort_hours: 3-4
    dependencies: []
    deliverables:
      - documentation/README.md (updated with routing)
      - documentation/getting-started/use-cases/choosing-your-path.md
    acceptance_criteria:
      - Clear routing for 6 personas (dev, creator, maker, hobbyist, freelancer, writer)
      - Planned vs Vibe mode explained
      - Non-coding vs Software paths explained
      - Visual/interactive if possible
      - Mobile-friendly
    salvage: null
    notes: |
      This is the critical first impression. Needs to be welcoming, not intimidating.
      Show diversity of use cases immediately.

  # ---------------------------------------------------------------------------
  # Developer Path
  # ---------------------------------------------------------------------------

  - id: P1-T02
    title: QUICKSTART-DEVELOPERS.md
    description: |
      5-minute quick start guide for developers. Includes both planned and vibe
      mode options. Gets developer from installation to first sprint fast.
    audience: [developers]
    use_case: [planned, vibe, software]
    priority: P1-Critical
    effort_hours: 4-6
    dependencies: [P1-T01]
    deliverables:
      - documentation/getting-started/developers/QUICKSTART-DEVELOPERS.md
    acceptance_criteria:
      - Time-boxed to 5 minutes
      - Copy-paste ready commands
      - Includes vibe mode option
      - Verification steps at each stage
      - Links to deeper guides
      - Technical language appropriate for developers
    salvage: Sprint 21 QUICKSTART.md (100% reusable as base)
    notes: |
      Salvage Sprint 21 work, add vibe mode section.

  - id: P1-T03
    title: Sprint Protocol Primer
    description: |
      5-minute overview of Sprint Protocol for developers. Explains what it is,
      why it matters, core concepts. Includes use case spectrum explanation.
    audience: [developers]
    use_case: [all]
    priority: P1-Critical
    effort_hours: 3-4
    dependencies: []
    deliverables:
      - documentation/getting-started/developers/05-understanding-protocol.md
      - documentation/getting-started/shared/sprint-protocol-overview.md
    acceptance_criteria:
      - 5-minute read time
      - Explains planned vs vibe modes
      - Core concepts (worktree, manifest, phases)
      - Links to full AGENTS.md for reference
      - Use case spectrum explained
    salvage: null
    notes: |
      This bridges the gap between QUICKSTART and full AGENTS.md.
      Progressive disclosure approach.

  - id: P1-T04
    title: Structure the Vibe Guide
    description: |
      Complete guide to vibe mode for developers. Philosophy, examples, vibe→production
      pipeline. Shows value of exploratory sprints.
    audience: [developers]
    use_case: [vibe]
    priority: P1-Critical
    effort_hours: 4-6
    dependencies: [P1-T03]
    deliverables:
      - documentation/guides/vibe-mode/what-is-vibe-mode.md
      - documentation/guides/vibe-mode/vibe-examples.md (3 dev examples)
      - documentation/guides/vibe-mode/vibe-to-production-pipeline.md
      - documentation/getting-started/shared/vibe-mode-philosophy.md
    acceptance_criteria:
      - 3 complete developer vibe examples (WebGL, API exploration, prototyping)
      - Vibe→production transition explained
      - Value proposition clear
      - Not intimidating, sounds fun
      - Examples show real evolution
    salvage: null
    notes: |
      Critical differentiator. Must feel liberating, not chaotic.

  - id: P1-T05
    title: Project Setup Guide
    description: |
      Step-by-step guide for adding sprint-mcp to existing project.
      Covers both planned and vibe setup.
    audience: [developers]
    use_case: [planned, vibe]
    priority: P1-Critical
    effort_hours: 4-6
    dependencies: [P1-T02]
    deliverables:
      - documentation/getting-started/developers/02-project-setup.md
    acceptance_criteria:
      - Git repository requirements explained
      - Sprint directory structure setup
      - Configuration walkthrough
      - Both planned and vibe setup covered
      - Common issues documented
    salvage: null
    notes: |
      Addresses critical gap from Sprint 21 analysis.

  - id: P1-T06
    title: First Sprint Tutorial (Planned)
    description: |
      Complete walkthrough of first planned sprint for developers.
      "Add OAuth2 authentication" example from start to finish.
    audience: [developers]
    use_case: [planned, software]
    priority: P1-Critical
    effort_hours: 6-8
    dependencies: [P1-T05]
    deliverables:
      - documentation/getting-started/developers/03-first-sprint-planned.md
      - documentation/examples/developers/planned-sprints/oauth2-auth.md
    acceptance_criteria:
      - Complete worked example
      - Every phase documented
      - Common pitfalls called out
      - Verification at each step
      - Ready to follow step-by-step
    salvage: null
    notes: |
      Traditional sprint example, high quality.

  - id: P1-T07
    title: First Sprint Tutorial (Vibe)
    description: |
      Complete walkthrough of first vibe sprint for developers.
      "Explore WebGL shaders" example showing exploratory workflow.
    audience: [developers]
    use_case: [vibe, software]
    priority: P1-Critical
    effort_hours: 6-8
    dependencies: [P1-T04, P1-T05]
    deliverables:
      - documentation/getting-started/developers/04-first-sprint-vibe.md
      - documentation/examples/developers/vibe-sprints/webgl-shaders.md
    acceptance_criteria:
      - Shows exploratory workflow
      - No pressure for specific deliverables
      - Demonstrates capture of experiments
      - Shows vibe→production transition
      - Feels liberating, not chaotic
    salvage: null
    notes: |
      Critical for developers who don't like rigid planning.

  # ---------------------------------------------------------------------------
  # Non-Developer Path
  # ---------------------------------------------------------------------------

  - id: P1-T08
    title: Non-Developers Welcome Page
    description: |
      Welcoming landing page for non-developers. Modern creators, not corporate.
      Diverse persona representation. "Yes, this is for you!"
    audience: [creators, makers, hobbyists, freelancers, writers]
    use_case: [all]
    priority: P1-Critical
    effort_hours: 3-4
    dependencies: [P1-T01]
    deliverables:
      - documentation/getting-started/non-developers-welcome.md
    acceptance_criteria:
      - Welcoming, not intimidating
      - Shows 6 diverse personas
      - No technical jargon
      - Success stories preview
      - "You don't need to code" messaging
      - Links to persona-specific paths
    salvage: null
    notes: |
      Critical first impression for non-developers. Make or break.

  - id: P1-T09
    title: Beginner's Concept Guide
    description: |
      Plain-language explanation of concepts. What is git, MCP, sprint, worktree.
      Uses analogies, not technical definitions.
    audience: [creators, makers, hobbyists, freelancers, writers]
    use_case: [all]
    priority: P1-Critical
    effort_hours: 4-6
    dependencies: []
    deliverables:
