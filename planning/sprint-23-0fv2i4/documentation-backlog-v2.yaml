      - LLM-guided workflow
      - Emphasizes non-coding entry
      - Links to persona-specific guides
      - No command-line required for setup
      - Builds confidence
    salvage: null
    notes: |
      Different approach than developer quickstart. More visual, more supportive.

  - id: P1-T11
    title: Non-Coding First Sprint Guide (6 Examples)
    description: |
      Complete guide with 6 diverse non-coding sprint examples. One per persona.
      Full walkthroughs. Vibe mode available for all.
    audience: [creators, makers, hobbyists, freelancers, writers]
    use_case: [planned, vibe, non-coding]
    priority: P1-Critical
    effort_hours: 8-10
    dependencies: [P1-T10]
    deliverables:
      - documentation/getting-started/creators/non-coding-projects/youtube-series.md
      - documentation/getting-started/makers/non-coding-projects/product-launch.md
      - documentation/getting-started/hobbyists/non-coding-projects/novel-outline.md
      - documentation/getting-started/community-builders/non-coding-projects/event-organizing.md
      - documentation/getting-started/freelancers/non-coding-projects/client-project.md
      - documentation/getting-started/writers/non-coding-projects/newsletter-launch.md
    acceptance_criteria:
      - 6 complete examples (one per persona)
      - Each shows full sprint lifecycle
      - Relatable to target audience
      - Both planned and vibe modes shown
      - Builds confidence in process
      - No coding required
    salvage: null
    notes: |
      CRITICAL - this is the primary entry path for non-developers.
      Must be excellent quality, relatable, confidence-building.

  - id: P1-T12
    title: Software Transition Tutorial
    description: |
      Guide for transitioning from non-coding to software sprints.
      Leverages familiar process, reduces anxiety.
    audience: [creators, makers, hobbyists, freelancers, writers]
    use_case: [software]
    priority: P1-Critical
    effort_hours: 6-8
    dependencies: [P1-T11]
    deliverables:
      - documentation/getting-started/shared/transition-non-coding-to-software.md
      - documentation/getting-started/creators/software-projects/first-software-sprint.md
      - documentation/getting-started/makers/software-projects/build-your-tool.md
    acceptance_criteria:
      - Emphasizes familiar process
      - "Same workflow, LLM does coding" messaging
      - Simple first software project for each persona
      - Builds on non-coding sprint confidence
      - Reduces anxiety about coding
      - Celebrates progress
    salvage: null
    notes: |
      Critical transition moment. Must feel natural, not intimidating.

  # ---------------------------------------------------------------------------
  # LLM Agent Enhancement
  # ---------------------------------------------------------------------------

  - id: P1-T13
    title: LLM-USAGE-GUIDE.md Section 9 (Enhanced)
    description: |
      Add Section 9 to LLM Usage Guide covering adaptive communication for
      tri-audience, multi-use-case system.
    audience: [llm-agents]
    use_case: [all]
    priority: P1-Critical
    effort_hours: 4-6
    dependencies: []
    deliverables:
      - documentation/reference/LLM-USAGE-GUIDE.md (Section 9 added)
    sections:
      - 9.1: Detecting User Context (tech level, project type, intent)
      - 9.2: Adaptive Communication Patterns
      - 9.3: Supporting Non-Coding Projects
      - 9.4: Supporting Vibe Mode
      - 9.5: Non-Developer Error Recovery
      - 9.6: Transition Support (non-coding → software)
      - 9.7: Complete Examples (all scenarios)
    acceptance_criteria:
      - Detection matrix complete (user × project × intent)
      - Adaptive patterns for all combinations
      - Non-coding project support clear
      - Vibe mode support welcoming
      - Examples cover all scenarios
      - Plain-language error translations
      - Transition support encouraging
    salvage: Sprint 21 LLM-USAGE-GUIDE.md Sections 1-8 (95% complete)
    notes: |
      Salvage excellent Sprint 21 work, add critical Section 9.
      This makes or breaks the non-developer experience.

