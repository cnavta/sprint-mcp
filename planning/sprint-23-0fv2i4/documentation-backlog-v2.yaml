      - Confidence-building tone
    salvage: null
    notes: |
      Bridge between intimidation and understanding.

  - id: P1-T10
    title: QUICKSTART-NON-DEVELOPERS.md
    description: |
      Visual, LLM-guided quick start for non-developers. Emphasizes non-coding entry.
