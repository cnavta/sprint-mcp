      - Performance optimization
      - Testing strategies
    salvage: null
    notes: |
      For when LLM guide Section 9 is mastered.

  # ---------------------------------------------------------------------------
  # Protocol Refinements
  # ---------------------------------------------------------------------------

  - id: P2-T08
    title: Protocol Refinement - Multi-Sprint Parallelization
    description: |
      Revise Sprint Protocol Rule S3 ("Only one sprint may be active at a time")
      to support concurrent sprints. With git worktrees providing isolated workspaces,
      this constraint is artificial and prevents multi-agent workflows.
    audience: [developers, llm-agents]
    use_case: [all]
    priority: P2-High
    effort_hours: 4-6
    dependencies: []
    deliverables:
      - AGENTS-uncompressed.md (Rule S3 revised)
      - AGENTS.md (recompressed)
      - documentation/guides/advanced/parallel-sprints.md
      - Test cases for concurrent sprint scenarios
    acceptance_criteria:
      - Rule S3 revised to allow concurrent sprints when using worktrees
      - Documentation explains when/how to use parallel sprints safely
      - Multi-agent collaboration patterns documented
      - Conflict resolution strategies defined
      - MCP tools updated to handle concurrent sprints
      - Test coverage for parallel sprint operations
      - Migration guide for existing users
    salvage: null
    notes: |
      Sprint 23 insight: Worktree model makes this constraint unnecessary.
      Enables advanced workflows like:
      - Multiple agents working on different features simultaneously
      - Parallel exploration in vibe mode
      - Feature development while bug fixing
      - A/B testing different approaches

      Must address:
      - Sprint index locking/concurrency
      - Clear worktree isolation guarantees
      - User communication about active sprints
      - Archive/cleanup with multiple active sprints

