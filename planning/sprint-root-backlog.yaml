        status: planned
        acceptance_criteria:
          - "getProjectRoot() function implemented"
          - "Reads SPRINT_ROOT environment variable"
          - "Falls back to process.cwd() if not set"
          - "Returns absolute path"
          - "Handles empty/undefined SPRINT_ROOT"
        deliverables:
          - "src/common/project-config.ts"
        files_to_create:
          - path: "src/common/project-config.ts"
            type: "production"
        implementation_notes: |
          Core implementation:
          ```typescript
          export function getProjectRoot(): string {
            const sprintRoot = process.env.SPRINT_ROOT;
            if (!sprintRoot || sprintRoot.trim() === '') {
              return process.cwd();
            }
            // Validate it's an absolute path
            if (!path.isAbsolute(sprintRoot)) {
              throw new Error(`SPRINT_ROOT must be an absolute path, got: ${sprintRoot}`);
            }
            return sprintRoot;
          }
          ```

