  - id: BL-017
    title: Update example sprint directories
    description: |
      Update any example sprint directories in examples/ to not include
      publication.yaml, or mark it as deprecated/optional.
    priority: P2
    status: deferred
    phase: documentation
    dependencies:
      - BL-009
    estimated_hours: 0.25
    acceptance_criteria:
