  # ============================================================================
  # PHASE 5: INTEGRATION TESTING
  # ============================================================================

  - id: BL-018
    title: End-to-end integration test
    description: |
      Perform full sprint lifecycle test without publication.yaml:

      1. Start new sprint
      2. Complete implementation
      3. Run validation
      4. Create completion artifacts (without publication.yaml)
      5. Complete sprint (should succeed)
      6. Verify sprint-manifest.yaml has all needed data
      7. Verify sprint-index.yaml updated correctly
      8. Create PR
      9. Verify PR URL in manifest.links.pr
      10. Archive sprint

      This validates the entire workflow works without publication.yaml.
    priority: P0
    status: completed
    phase: integration-testing
    dependencies:
      - BL-004
      - BL-007
      - BL-009
    estimated_hours: 1
    acceptance_criteria:
      - Full sprint lifecycle completes without errors
      - No publication.yaml created
      - All data tracked in manifest and index
      - PR creation works
      - Archive works
      - No regressions in existing functionality
    notes: |
      This is the final validation that everything works together.
      Can be done as part of completing Sprint 20 or as a separate test sprint.

