notes: |
  This backlog implements Option 3 from the analysis report: complete deprecation
  of publication.yaml with migration to sprint-manifest.yaml.

  The implementation is designed to be:
  - Backward compatible (old sprints keep working)
  - Gradual (old publication.yaml files remain)
  - Well-tested (multiple test tasks)
  - Well-documented (migration guide, updated docs)

  Total estimated effort: 7.25 hours
  Critical path can be completed in one focused sprint.

  Deferred task BL-014 (migration script) can be implemented later if needed,
  but is not required for the deprecation to work.
