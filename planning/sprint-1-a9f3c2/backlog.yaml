sprint: sprint-1-a9f3c2
status: blocked
items:
  - id: REQ-001
    title: Reframe the protocol as a Human-LLM partnership
    status: complete
    acceptance:
      - Human decision rights are explicit.
      - LLM responsibilities are explicit.
      - Lifecycle language consistently reflects partnership.
  - id: REQ-002
    title: Define intentional Git behavior
    status: complete
    acceptance:
      - A sprint branch is required at initialization.
      - Regular commits represent coherent work units.
      - Commit messages carry intent plus sprint and request traceability.
      - Push occurs after validation and verification as the final LLM publication handoff.
  - id: REQ-003
    title: Make releases exclusively human-owned
    status: complete
    acceptance:
      - LLMs cannot execute a mutating release command.
      - No project-specific release tool is prescribed.
      - Non-mutating release assistance remains available when explicitly approved.
  - id: REQ-004
    title: Structure learning artifacts for future extraction
    status: complete
    acceptance:
      - Retro records distinguish observations, evidence, decisions, and outcomes.
      - Learning records are atomic and include applicability, confidence, and tags.
      - No semantic extraction implementation is introduced.
  - id: REQ-005
    title: Validate and publish the governance revision
    status: blocked
    blockedBy: A verified and explicitly authorized Git remote is required for push.
    acceptance:
      - Documentation checks, build, and tests pass or exceptions are accepted.
      - The branch is pushed, or a failed attempt is logged and accepted.
      - Any PR action follows the owner and timing declared in the approved sprint plan.
  - id: REQ-011
    title: Add the human follow-up backlog loop
    status: complete
    acceptance:
      - A compact Stop, Clarify, Append, Continue protocol is defined.
      - The LLM pauses advancement and asks only questions needed to make the follow-up actionable.
      - Follow-up work is appended to the end of backlog.yaml unless the human specifies another position.
      - Existing scope-change approval gates remain in force.
      - After clarification and any required approval, work resumes at the next ready backlog item in declared order.
  - id: REQ-013
    title: Make PR and release policy flexible and project-neutral
    status: complete
    acceptance:
      - All brat and BitBrat references are removed from the protocol.
      - PR creation is optional and its owner and timing are declared in the approved sprint plan.
      - LLM PR creation occurs only when explicitly approved for the sprint.
      - Sprint completion does not require a PR unless the approved sprint plan says it does.
      - The human decides whether, when, and how to release without a prescribed project-specific command.
      - Optional create-pull-request architecture capability remains available without being mandatory.
  - id: REQ-015
    title: Make Human-LLM turns the primary request-log record
    status: complete
    acceptance:
      - Every sprint-relevant Human-LLM turn records intent, interpretation, decisions, and resulting state changes.
      - State-changing operations, validation or publication evidence, and material failures remain logged.
      - Routine read-only discovery and repeated diagnostics may be summarized or omitted.
      - Logs prefer concise outcomes and references over raw terminal output.
      - Secrets and credentials are never recorded.
  - id: REQ-016
    title: Repair lifecycle states, terminology, and section numbering
    status: complete
    acceptance:
      - Manifest states include blocked, ready-for-handoff, complete, and cancelled.
      - Normal and forced completion are distinguished explicitly.
      - PR state is not a mandatory sprint lifecycle state.
      - Verification refers to the execution plan consistently.
      - Top-level section numbering is sequential.
