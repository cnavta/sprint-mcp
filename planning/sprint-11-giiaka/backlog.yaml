# ============================================================================
# Risk Mitigation
# ============================================================================

risks:
  high:
    - risk: Compression modules too complex for integration tests
      mitigation: Phase 0 validation spike identifies issues early
      fallback: Reduce coverage target to 70% or defer CLI

    - risk: Require large test data corpus
      mitigation: Start with synthetic examples
      fallback: Use simple test cases rather than real corpus

  medium:
    - risk: Coverage target (75% overall) too ambitious
      mitigation: Module-specific targets as primary success
      fallback: Accept 72-73% if all module targets met

    - risk: Sprint takes longer than expected
      mitigation: Phased approach allows partial completion
      fallback: Defer P1 items if P0 takes longer

  low:
    - risk: Integration test pattern doesn't work
      mitigation: Phase 0 spike validates approach
      confidence: High based on Sprint 10 success
