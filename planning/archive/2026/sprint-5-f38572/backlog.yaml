      - scenario: "Invalid status"
        expected: "Error thrown, no changes made"
      - scenario: "Sprint not found"
        expected: "Error thrown with clear message"
      - scenario: "Partial update"
        expected: "Only specified fields updated"
      - scenario: "Index failure"
        expected: "Manifest updated, warning logged, operation succeeds"

    implementationNotes: |
      - Create src/tools/__tests__/update-sprint-status.test.ts
      - Use temporary directories with real manifest files
      - Verify atomicity (both files updated or neither)
      - Test all parameter combinations
      - Mock filesystem operations where appropriate

  # =============================================================================
  # PHASE 3: Validation Integration
  # =============================================================================

  - id: TASK-014
    title: "Integrate Validation into Regenerate Tool"
    description: "Call validation after regeneration and report issues"
    category: "validation-layer"
    priority: "P1-HIGH"
    status: "pending"
    estimatedHours: 0.5
    dependencies: ["TASK-012"]

    deliverables:
      - "Modified src/tools/regenerate-sprint-index.ts"

    acceptanceCriteria:
      - "Validation runs automatically after regeneration"
      - "Validation results included in tool output"
      - "Warnings shown but don't block operation"
      - "Errors shown with remediation guidance"
      - "Success message if no issues found"

    implementationApproach: |
      After regeneration completes:
      1. Call validateSprintIndex()
      2. If validation.valid === false:
         - Append "Validation Issues" section to output
         - List all errors with codes and messages
         - List all warnings with codes and messages
         - Provide remediation guidance
      3. If validation.valid === true:
         - Append "Validation: Passed" to output

    implementationNotes: |
      - Import validateSprintIndex from sprint-index-validator
      - Call after regenerateSprintIndex() completes
      - Format validation results as markdown
      - Don't throw on validation failures (non-fatal)
      - Include validatedAt timestamp

  - id: TASK-015
    title: "Add Validation to Start/Update Tools"
    description: "Add optional validation to start-sprint and update-sprint-status tools"
    category: "validation-layer"
    priority: "P1-HIGH"
    status: "pending"
    estimatedHours: 0.75
    dependencies: ["TASK-012"]

    deliverables:
      - "Modified src/tools/start-sprint.ts"
      - "Modified src/tools/update-sprint-status.ts"

    acceptanceCriteria:
      - "Validate index after adding sprint (start-sprint)"
      - "Validate index after status update (update-sprint-status)"
      - "Validation failures logged as warnings"
      - "Operations still succeed even with validation warnings"
      - "Optional: Can disable validation via parameter"

    implementationApproach: |
      For both tools:
      1. After index update completes
      2. Call validateSprintIndex()
      3. If !validation.valid:
         - Log warnings to console/output
         - Don't block operation
         - Include validation summary in result
      4. Tool still returns success

    implementationNotes: |
      - Add validation as optional final step
      - Non-fatal (operations complete regardless)
      - Log validation results for troubleshooting
      - Consider adding --skip-validation flag (optional)
      - Consistent error formatting across both tools

