tasks:
  # =============================================================================
  # PHASE 1: Validation Layer Foundation (Critical Path)
  # =============================================================================

  - id: TASK-012
    title: "Implement Validation Logic"
    description: "Create sprint-index-validator.ts module to detect index inconsistencies"
    category: "validation-layer"
    priority: "P1-HIGH"
    status: "pending"
    estimatedHours: 1.5
    dependencies: []

    deliverables:
      - "src/common/sprint-index-validator.ts"
      - "Type definitions: ValidationIssue, IndexValidationResult"
      - "Function: validateSprintIndex()"

    acceptanceCriteria:
      - "Validate index schema (version, required fields)"
      - "Validate sprint entry fields (id, title, status, owner, etc.)"
      - "Check status values against allowed enum"
      - "Verify manifest files exist for all index entries"
      - "Detect orphaned manifests (in planning/ but not in index)"
      - "Compare index data with manifest data for consistency"
      - "Return structured validation result with errors and warnings"
      - "No thrown errors - always return IndexValidationResult"

    validationChecks:
      - "Schema validation (version, top-level fields)"
      - "Entry validation (required fields per sprint)"
      - "Status enum validation"
      - "Manifest file existence"
      - "Data consistency (index vs manifest)"
      - "Orphan detection"
      - "Statistics accuracy"

    implementationNotes: |
      Interface structure:
      - ValidationIssue: { severity, code, message, sprintId?, field? }
      - IndexValidationResult: { valid, errors, warnings, validatedAt }

      Key principles:
      - Return structured results (not thrown errors)
      - Distinguish errors vs. warnings
      - Provide actionable error codes and messages
      - Non-blocking (always returns result)

    testingNotes: "Will be tested in TASK-013"

  - id: TASK-013
    title: "Write Validation Tests"
    description: "Comprehensive test suite for validation logic"
    category: "validation-layer"
    priority: "P1-HIGH"
    status: "pending"
    estimatedHours: 1.0
    dependencies: ["TASK-012"]

    deliverables:
      - "src/common/__tests__/sprint-index-validator.test.ts"

    acceptanceCriteria:
      - "Test valid index passes validation"
      - "Test missing required fields detected"
      - "Test invalid status values detected"
      - "Test missing manifest files detected"
      - "Test orphaned manifests detected (warning)"
      - "Test data inconsistencies detected"
      - "Test statistics mismatch detected"
      - "Test multiple issues reported together"
      - "Test validation result structure"

    testScenarios:
      - scenario: "Valid index"
        expected: "{ valid: true, errors: [], warnings: [] }"
      - scenario: "Missing required field"
        expected: "{ valid: false, errors: [{ code: 'MISSING_FIELD', ... }] }"
      - scenario: "Invalid status"
        expected: "{ valid: false, errors: [{ code: 'INVALID_STATUS', ... }] }"
      - scenario: "Missing manifest"
        expected: "{ valid: false, errors: [{ code: 'MANIFEST_NOT_FOUND', ... }] }"
      - scenario: "Orphaned manifest"
        expected: "{ valid: true, warnings: [{ code: 'ORPHANED_MANIFEST', ... }] }"
      - scenario: "Data inconsistency"
        expected: "{ valid: false, errors: [{ code: 'DATA_MISMATCH', ... }] }"
      - scenario: "Statistics mismatch"
        expected: "{ valid: false, errors: [{ code: 'STATS_MISMATCH', ... }] }"

    implementationNotes: |
      - Create fixture files for various scenarios
      - Use temporary directories for isolation
      - Mock file I/O where appropriate
      - Follow existing test patterns

