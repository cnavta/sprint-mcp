      Implement optional hook scripts (.sprint-hooks/post-start, pre-complete, etc.) executed at lifecycle events.
    artifacts:
      - path: planning/sprint-15-dq6cg7/sprint-hooks-design.md
        type: design_doc
        description: Complete design proposal with implementation plan
      - path: planning/sprint-15-dq6cg7/worktree-deployment-verification.md
        type: validation_report
        description: Deployment verification that identified the need for hooks
    acceptance_criteria:
      - post-start hook runs after worktree created (automates npm ci, env setup)
      - pre-complete hook runs before validation (final checks, prevent incomplete work)
      - Hooks are optional (backward compatible)
      - Hooks receive context (SPRINT_ID, SPRINT_WORKTREE, etc.)
      - Example hooks provided for Node.js, Python projects
      - Documentation in AGENTS.md
      - Integration tests for hook execution
    references:
      - section: "sprint-hooks-design.md - Complete proposal"
      - issue: "Discovered during sprint-15 deployment verification"

# ==========================================================================
# NOTES
# ==========================================================================
notes:
  key_insight: >
    The problem was NOT tool worktree-awareness (tools ARE aware via SPRINT_ROOT).
    The problem was AGENT worktree-awareness (agents didn't know to work in worktree).
    Solution: Update AGENTS.md guidance + update tools to create artifacts in worktree.

  simplified_model: >
    User correctly identified that the simplest model is "agent works in worktree
    for everything." This eliminates context switching and makes PRs include both
    code and planning artifacts.

  migration_approach: >
    Grandfathering existing sprints (1-15) avoids migration risk. New sprints (16+)
    use unified model. Clear documentation prevents confusion.

  testing_strategy: >
    Integration tests + manual validation with sprint-16 + tool compatibility tests.
    Sprint-16 becomes the validation case for unified model.

  timeline: >
    21.5 hours over 4 days. Front-load guidance updates so tools can be implemented
    against clear spec. Test thoroughly before rollout.
