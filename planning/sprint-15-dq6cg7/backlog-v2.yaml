# Sprint 15 Prioritized Backlog v2
# Unified Worktree Model Implementation

metadata:
  sprint_id: sprint-15-dq6cg7
  sprint_title: Worktree-Aware Tool Remediation (Agent-Focused)
  backlog_version: 2
  generated_at: 2026-08-06T00:00:00Z
  total_tasks: 15
  total_estimated_hours: 21.0

summary:
  problem_statement: >
    Agents are not worktree-aware. They must work in TWO locations: code changes in worktree
    (.worktrees/sprint-N/src/) and planning artifacts in main repo (planning/sprint-N/).
    This violates AGENTS.md guidance and creates confusion.

  solution: >
    Implement unified worktree model where ALL sprint work (code + planning) happens
    in the worktree. Agent cd to .worktrees/sprint-N/ and stays there. Planning artifacts
    are on feature branch and merge to main via PR.

  approach: >
    1. Update AGENTS.md to clarify "work in worktree"
    2. Update MCP tools to create/find artifacts in worktree
    3. Grandfather existing sprints (1-15 keep split model)
    4. Apply unified model starting with sprint-16
    5. Comprehensive testing and documentation

